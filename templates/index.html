<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FindBest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>FindBest</h1>
      </header>

      <form id="search-form" class="search-panel" action="/api/search" method="post">
        <label class="sr-only" for="query"> </label>
        <div class="search-row">
          <input id="query" name="query" type="search" required maxlength="200" autocomplete="off" />
          <button type="submit" id="search-btn">Search</button>
        </div>
      </form>

      <p id="error" class="error" hidden></p>
      <section id="picks" class="picks" hidden></section>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
